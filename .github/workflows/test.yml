name: test
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Vane
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # ── 前端 ──────────────────────────────────────────────────────────────────
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build frontend
        working-directory: web
        run: |
          npm install
          npm run build

      # ── Rust + cross ──────────────────────────────────────────────────────────
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_86-unknown-linux-musl

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          key: x86_86-unknown-linux-musl

      # cross 解决 glibc 交叉编译器无法链接 musl + SQLite bundled 的问题
      - name: Install cross
        run: cargo install cross --git https://github.com/cross-rs/cross --locked

      - name: Build
        run: |
          cross build --release --target x86_86-unknown-linux-musl
          cp target/x86_86-unknown-linux-musl/release/vane vane-linux-x86_86
          chmod +x vane-linux-x86_86

      # ── 发布 ──────────────────────────────────────────────────────────────────
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: test
          name: "Vane test"
          files: |
            vane-linux-x86_86
          draft: false
          prerelease: true
